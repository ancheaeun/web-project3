<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #pr{
            width: 300px;
            position: relative;
            cursor: pointer;
        }
        img{
            width: 100%;
            display: block;
        }
        #pr>div{
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);          
            opacity: 0;

        }
        #pr>div>p{
            color: white;
            position: absolute;
            top: 50%;
            margin: 0;
            left: 50%;
            font-size: 2em;
            transform: translate(-50%,-50%);
        }
        #pr:hover div{
            opacity: 1;
            transition: all 0.5s;
        }
    </style>
</head>
<body>
    <div id="pr">
        <img src="img/portfolio/cabin.png" alt="img">
        <div>
           <p>+</p> 
        </div>  
    </div>
    
</body>
</html>
